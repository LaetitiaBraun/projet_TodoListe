<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Todo List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
	<main class="container">

		<h1>Ma Todo List</h1>

		<form id="todoForm">
			<input
				type="text"
				id="toDoInput"
				placeholder="ajouter une tache"
				autocomplete="off"
			>
			<button type="submit">Ajouter</button>
		</form>
		<p id="message"></p>
		<ul id="toDoList"></ul>
		<div class="footer">
			<p>
				<span id="count">0</span> tâche(s) à faire
			</p>
			<div class="filter">
				<button class="filter active" data-filter="all">toutes</button>
				<button class="filter" data-filter="todo">A faire</button>
				<button class="filter" data-filter="done">Terminée</button>
			</div>
		</div>

	</main>

	<!-- Bootstrap JS (inclut Popper) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script src="js/script.js"></script>
</body>
</html>
