<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <!-- <link href="css/style.css" rel="stylesheet"> -->
  </head>
  <body>
  <main class="container">
	  <h1>Ma Todo List <h1>
			  <form id="todoForm">
				  <input type="text" id="todoInput" placeholder="Ajouter une tâche..." autocomplete="off">
				  <button type="submit">Ajouter</button>
			  </form>

			  <p id="message"></p>

			  <ul id="todoList"> </ul>

			  <div class="footer">
				  <p>
				  <span id="count">0</span> tâche(s) restante(s)
				  </p>
				  
				  <div class="filter"> 
					  <button class="filter active" datafilter="all"> Toutes</button>
					  <button class="filter" datafilter="todo"> À faire</button>
					  <button class="filter" datafilter="done"> Terminées</button>
				  </div>
			  </div>
  </main>
  </body></html>
