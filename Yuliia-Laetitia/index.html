<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Todo List</title>
    <!-- <link href="css/style.css" rel="stylesheet"> -->
  </head>
  <body>
  <main class="container">
	  <h1>Ma ToDo Liste</h1>
	  <form id="todoForm">
	  
		  <input type="text" id="todoInput" placeholder="Ajouter une tache..." autocomplete="off">
		  </input>
		  <button type="submit">Ajouter</button>
	  </form>
	  <p id="message"></p>
	  <ul id="todoList">

	  </ul>
	  <div class="footer">
	  <p>
	  <span id="count">0</span>
	  tache(s) restante(s)
	  </p>
	  
	  <div class="filter">
	

	  <button class="filter active" data-filter="all">Toutes</button>
	  <button class="filter" data-filter="todo">A faire</button>
	  <button class="filter" data-filter="done">Terminees</button>
	  </div>
	  </div>
 
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
  </main>
  </body>
</html>
